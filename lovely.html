<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Visual Hierarchy — Coding Challenge</title>
<link rel="stylesheet" href="lovely.css">
</head>
<body>

  <div class="poster">

    <!-- Hierarchy level 4: read last — small, dim, but first in the code -->
    <p class="last">was a lovely surprise.</p>

    <!-- Hierarchy level 1: read first — big, bold, yellow-framed focal point -->
    <div class="first">
      <span class="accent">I HEARD</span> A KNOCK<br>
      ON THE DOOR
    </div>

    <!-- Hierarchy level 2: read second — white bar, medium bold text -->
    <p class="second">so I went to open the door...</p>

    <!-- Hierarchy level 3: read third — small italic text -->
    <p class="third">...and what I saw</p>

  </div>

</body>
</html>
